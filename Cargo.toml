[package]
name = "rembg-rs"
version = "0.1.4"
edition = "2024"
authors = ["WarRaft"]
description = "A Rust library for removing backgrounds from images using neural networks"
license = "MIT"
repository = "https://github.com/WarRaft/rembg-rs"
keywords = ["image", "background-removal", "neural-network", "onnx", "computer-vision"]
categories = ["multimedia::images", "science"]

[lib]
name = "rembg_rs"
path = "src/lib.rs"

[[bin]]
name = "rembg-rs"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "rembg-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = []
cli = []
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:serde", "dep:serde_json", "dep:mime_guess", "dep:tracing", "dep:tracing-subscriber", "dep:futures-util", "dep:base64"]
download = ["dep:ureq", "dep:md-5", "dep:sha2"]

[dependencies]
# Image processing
image = { version = "0.25.9", features = ["png", "jpeg", "webp"] }

# ONNX Runtime for neural network inference
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
libloading = "0.9"

# Tensor operations
ndarray = "0.17.1"

# Command-line argument parsing (optional, only for CLI)
clap = { version = "4.4", features = ["derive"] }

derive_builder = "0.20.2"
imageproc = "0.25.0"
anyhow = "1.0.100"
oxipng = "10.0.0"
imagequant = "4.4.1"
png = "0.18.0"

# HTTP Server (optional, only for server feature)
axum = { version = "0.8", features = ["multipart", "macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
mime_guess = { version = "2.0", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
futures-util = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }

# Model download (optional)
ureq = { version = "3.0", features = ["native-tls"], optional = true }
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
thirtyfour = "0.37"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
